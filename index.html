.fcard{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.fcard .ft{font-weight:600;line-height:1.65}

.wait{min-height:100vh;display:grid;place-items:center;background:var(--slate);color:#fff;text-align:center}

}

.otitle{border:1.5px solid var(--line);border-radius:22px;text-align:center;padding:8px 14px;margin:14px 0}

<body>
<section id="gate" class="gate" hidden></section>
<div class="wrap" id="app">
  <aside class="rail">
    <div class="brand"><span><img class="blogo" src="logo.png" alt="">استمارة التقييم رقم 10</span>
      <button type="button" id="thBtn" class="thbtn" aria-label="بدّل إلى الوضع الليلي">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></g></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7 9.8 9.8 0 1 0 12.6 12.6.6.6 0 0 0-.7-.8Z"/></svg>
      </button></div>

      <div class="ruler"><i id="bar"></i>
        <b style="inset-inline-start:70%"></b><span style="inset-inline-start:70%">70</span>

        <b style="inset-inline-start:90%"></b><span style="inset-inline-start:90%">90</span>
      </div>
      <div class="warn" id="cap80" hidden>درجة (المحور الثالث/1) صفر، فلا تتجاوز الدرجة النهائية 80.</div>

    </div>

<script>

function renderTips(){

  if(AX.every(supLock))return[h('h2',{class:'axis-title'},'نصائح لرفع الدرجة'),h('p',{class:'note'},'كل محاور هذه الاستمارة يقيّمها المسؤول المباشر واللجنة العلمية. أهم ما ترفع به درجتك: أن تملأ البيانات الرئيسة، وترفع لكل فقرة وثائقها الداعمة كاملة وواضحة، ليقيّمك المقيّمون عليها.'),h('button',{class:'btn',type:'button',onclick:()=>go('docs')},'راجع وثائقك المرفوعة')];
  for(const a of AX){if(a.minus||supLock(a))continue;const wt=a.w?a.w/100:1,axRoom=a.cap-T.ax(a);if(axRoom<=0)continue;
    for(const it of axItems(a)){if(it.kind==='num')continue;const room=Math.min(capOf(it)-itemScore(it),axRoom);if(room<=0)continue;
      let how='';const v=S.v[it.id]||{};
      if(it.kind==='tally'){const o=[...it.opts].sort((x,y)=>Math.min(y.pts,room)-Math.min(x.pts,room)||x.pts-y.pts)[0];how='مثال: '+o.label+' (+'+Math.min(o.pts,room)+' في الفقرة)'}
      if(it.kind==='checks'){const un=it.opts.filter(o=>!v[o.k]);if(!un.length)continue;how='غير مؤشَّر: '+un[0].label+(un.length>1?'، و'+(un.length-1)+' غيرها':'')}

      if(it.kind==='hindex')how='ارفع معامل هيرش في سكوبس';
      tips.push({it,room,gain:room*wt,how})}}
  tips.sort((x,y)=>y.gain-x.gain);

    h('div',{class:'box'},next?'ينقصك '+r2(next[0]-T.fin)+' درجة لتصل إلى تقدير «'+next[1]+'».':'أنت في تقدير «امتياز».'),
    T.zero?h('div',{class:'warn',style:'margin-bottom:12px'},'أهم خطوة: لا يوجد بحث في مجلة مفهرسة في سكوبس أو كلاريفيت. درجتك النهائية لن تتجاوز 80 مهما رفعت باقي الفقرات. ',
      h('button',{class:'btn sm',type:'button',onclick:()=>go('a3','a3i1')},'افتح الفقرة')):null,
    miss?h('div',{class:'warn',style:'margin-bottom:12px'},miss+' فقرة فيها درجة بلا وثيقة. قد لا تُحتسب عند التدقيق. ',h('button',{class:'btn sm',type:'button',onclick:()=>go('docs')},'افتح الوثائق')):null,
    tips.length?h('div',{class:'box'},tips.slice(0,10).map(t=>h('div',{class:'tip'},
      h('div',null,t.it.label,h('div',{class:'chip',style:'white-space:normal'},'المحور '+ORD[AX.indexOf(t.it.ax)]+'. المتاح: '+r2(t.room)+' درجة. '+t.how)),
      h('span',{class:'gain'},'+ '+r2(t.gain)),h('button',{class:'btn ghost sm',type:'button',onclick:()=>go(t.it.ax.id,t.it.id)},'افتح الفقرة')))):
      h('p',{class:'note'},'أكملت كل الفقرات التي تتحكم بها. الباقي تقدير المسؤول المباشر.')];
}

}

function acct(){const a=document.getElementById('acct');if(!a)return;
  a.replaceChildren(...(auth&&me?[h('button',{class:'btn ghost sm',type:'button',onclick:backToLib},'كل الاستمارات'),h('span',{class:'chip',dir:'ltr'},me.email)]:[]))}

/* ---------- الإرسال إلى المسؤول المباشر ---------- */
async function toCloud(f){
  if(f.p)return f;
  const blob=await loadBlob(f);if(!blob)throw M('لم تُعثر على الوثيقة «'+f.name+'» في هذا الجهاز. ارفعها مرة أخرى.');
  const rec=await storeFile(new File([blob],f.name,{type:f.type||blob.type}));
  return rec;
}
let sent={},migrating=false,myRevs={};
const ROLES=[{k:'sup',by:'المسؤول المباشر',who:'المسؤول المباشر',to:'للمسؤول المباشر',f:'supEmail'},{k:'com',by:'اللجنة العلمية',who:'رئيس اللجنة العلمية',to:'لرئيس اللجنة العلمية',f:'comEmail'}];
const roleOf=a=>ROLES.find(r=>r.by===a.by);
const formRoles=()=>ROLES.filter(r=>AX.some(a=>a.by===r.by));
const subId=(r,u=uid)=>u+'_'+FID+'_'+r.k;
const roleAxes=r=>AX.filter(a=>a.by===r.by).map(a=>'('+ORD[AX.indexOf(a)]+')').join(' ');
function subText(r){const e=String(S.info[r.f]||'').trim().toLowerCase();
  if(!e)return['اكتب البريد الرسمي '+r.to+'، فتصل إليه استمارتك تلقائياً.',''];
  if(!isUom(e))return['اكتب البريد الرسمي كاملاً، أي البريد الذي ينتهي بـ '+DOMAIN,''];
  if(e===myMail())return['هذا بريدك أنت. اكتب بريد '+r.who+'.',''];
  return (sent[r.k]||'').split('|')[0]===e?['تصل استمارتك تلقائياً إلى '+r.who+'، ويرى كل تعديل تجريه فوراً.','var(--ok)']:['تُرسَل استمارتك…','']}
function paintSub(){formRoles().forEach(r=>{const [t,c]=subText(r);document.querySelectorAll('[data-substat="'+r.k+'"]').forEach(e=>{e.textContent=t;e.style.color=c})})}
async function migrateFiles(){if(migrating)return;migrating=true;
  try{for(const k in S.files){const a=S.files[k];for(let i=0;i<a.length;i++)if(!a[i].p)a[i]=await toCloud(a[i])}save()}catch(e){}migrating=false}
async function autoSub(){
  if(!(auth&&me&&docRef))return;
  const name=(S.info.name||me.displayName||'').trim().slice(0,120);let any=false;
  for(const r of formRoles()){
    const e=String(S.info[r.f]||'').trim().toLowerCase(),key=e+'|'+name,sid='subs/'+subId(r);
    if(key===(sent[r.k]||''))continue;
    if(!e&&sent[r.k]){try{await db.doc(sid).delete();delete sent[r.k]}catch(x){}continue}
    if(!isUom(e)||e===myMail())continue;
    try{await db.doc(sid).set({uid,form:FID,role:r.k,sup:e,tEmail:myMail(),name,at:Date.now()});sent[r.k]=key;any=true}catch(x){}
  }
  paintSub();if(any&&Object.values(S.files).some(a=>a.some(f=>!f.p)))migrateFiles();
}
async function loadRevs(){myRevs={};
  await Promise.all(formRoles().map(async r=>{try{const d=await db.doc('reviews/'+subId(r)).get();if(d.exists)myRevs[r.k]=JSON.parse(JSON.stringify(d.data()))}catch(e){}}));
  const v={};Object.values(myRevs).forEach(x=>Object.assign(v,x.v||{}));myReview=Object.keys(myRevs).length?{v}:null}
function supBox(){
  if(!(auth&&me&&docRef))return null;const rs=formRoles();if(!rs.length)return null;
  return h('div',{class:'box supbox'},'جهات التقييم',
    h('p',{class:'note'},'محاور هذه الاستمارة يقيّمها غيرك، فهي مقفلة أمامك. اكتب البريد الرسمي لكل جهة مرة واحدة، فتصل إليها استمارتك ووثائقك تلقائياً، وتضع درجاتها، ثم تُدمج الدرجات كلها في درجتك النهائية. عليك أنت ملء البيانات الرئيسة ورفع الوثائق الداعمة.'),
    rs.map(r=>{const [t,c]=subText(r);
      return h('div',{class:'role'},h('label',{class:'gfl'},h('span',null,'البريد الرسمي '+r.to,h('span',{class:'chip'},' يقيّم المحاور: '+roleAxes(r))),
        h('input',{class:'txt',type:'email',dir:'ltr',style:'width:100%;max-width:380px',placeholder:'name'+DOMAIN,value:S.info[r.f]||'','aria-label':'البريد الرسمي '+r.to,
          oninput:e=>{S.info[r.f]=e.target.value.trim();paintSub();save()}})),
        h('div',{class:'err','data-substat':r.k,role:'status',style:'color:'+c},t))}));
}
function sendBox(){
  const rf=h('button',{class:'btn ghost',type:'button'},'حدّث التقييمات');
  rf.onclick=busy(rf,'يُحدَّث…',async()=>{await loadRevs();render();refresh()});
  return h('div',{class:'box'},'جهات التقييم',
    formRoles().map(r=>{const [t,c]=subText(r),rv=myRevs[r.k];
      return h('div',{class:'role'},h('div',null,r.who+(S.info[r.f]?': ':''),S.info[r.f]?h('span',{dir:'ltr'},S.info[r.f]):null),
        h('div',{class:'err','data-substat':r.k,role:'status',style:'color:'+c},t),
        rv?h('div',{class:'note',style:'color:var(--ok)'},'قيّمك'+(rv.byName?' ('+rv.byName+')':'')+' بتاريخ '+fmtD(rv.at)+'.'+(rv.note?' ملاحظته: '+rv.note:'')):
          sent[r.k]?h('div',{class:'note'},'لم يقيّمك بعد.'):null)}),
    h('div',{class:'qrow',style:'margin-top:8px'},rf,h('button',{class:'btn ghost',type:'button',onclick:()=>go('info')},'عدّل بريد جهات التقييم')));
}

/* ---------- لوحة التقييم (المسؤول المباشر ورئيس اللجنة العلمية) ---------- */
async function reloadInbox(){try{const q=await db.collection('subs').where('sup','==',myMail()).get();
  inbox=q.docs.map(d=>Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data())))).filter(x=>x.role)}catch(e){inbox=[]}}
async function loadPeople(){
  const list=inbox.filter(x=>x.form===FID);
  people=await Promise.all(list.map(async x=>{let st=norm({}),rev=null;
    try{const d=await db.doc('users/'+x.uid+'/forms/'+FID).get();if(d.exists)st=norm(JSON.parse(JSON.stringify(d.data())))}catch(e){}
    try{const r=await db.doc('reviews/'+x.id).get();if(r.exists)rev=JSON.parse(JSON.stringify(r.data()))}catch(e){}
    return{id:x.id,role:ROLES.find(r=>r.k===x.role)||ROLES[0],name:String(x.name||'بدون اسم'),mail:x.tEmail||'',at:x.at,st,rev}}));
  if(cur==='sup')render();
}
function partial(st,v,role){let s=0;AX.filter(a=>a.by===role.by).forEach(a=>{const x=Math.min(a.cap,axItems(a,st).reduce((t,i)=>t+Math.max(0,+v[i.id]||0),0));s+=a.minus?-x:(a.w?x*a.w/100:x)});return r2(s)}
function renderSup(){
  if(!db||!me)return[h('h2',{class:'axis-title'},'لوحة التقييم'),h('p',{class:'note'},'اللوحة غير متاحة في هذا العرض.')];
  if(!people)return[h('h2',{class:'axis-title'},'لوحة التقييم'),h('p',{class:'note'},'تُحمَّل الاستمارات المرسلة إليك…')];
  const p=people.find(x=>x.id===supSel);
  if(!p)return[h('h2',{class:'axis-title'},'لوحة التقييم'),
    h('p',{class:'note'},'هنا استمارات التدريسيين الذين كتبوا بريدك بوصفك مسؤولهم المباشر أو رئيس لجنتهم العلمية. افتح الاستمارة، واطّلع على الوثائق، وضع درجات المحاور التي تخص صفتك، ثم احفظ التقييم ليصل إلى التدريسي.'),
    h('button',{class:'btn ghost sm',type:'button',onclick:async()=>{people=null;render();await reloadInbox();loadPeople()}},'حدّث القائمة'),
    people.length?h('div',{class:'box',style:'margin-top:10px'},people.map(x=>
      h('div',{class:'person'},h('div',null,x.name,h('div',{class:'chip',style:'white-space:normal'},'بصفتك: '+x.role.who+' . ',h('span',{dir:'ltr'},x.mail),' . '+(x.at?'وصلت '+fmtD(x.at)+'. ':'')+(x.rev?'قيّمته بتاريخ '+fmtD(x.rev.at):'لم تقيّمه بعد'))),
        h('button',{class:'btn sm',type:'button',onclick:()=>{supSel=x.id;R={v:Object.assign({},x.rev&&x.rev.v),note:x.rev&&x.rev.note||''};render();window.scrollTo({top:0})}},'افتح الاستمارة')))):
      h('p',{class:'note',style:'margin-top:10px'},'لم يرسل إليك أحد استمارته بعد.')];
  const st=p.st,role=p.role,fin=h('span'),msg=h('div',{class:'err',role:'status'});
  const upd=()=>{fin.textContent=partial(st,R.v,role)};
  const mine=a=>a.by===role.by;
  const rin=it=>{if(!mine(it.ax))return h('span',{class:'chip'},'تملؤه '+it.ax.by);
    const cap=capOf(it,st),mx=isFinite(cap)?cap:999;return h('input',{class:'num',type:'number',min:0,max:mx,step:'any',value:R.v[it.id]??'','aria-label':'درجتك: '+it.label,
    oninput:e=>{const x=e.target.value;if(x==='')delete R.v[it.id];else R.v[it.id]=Math.max(0,Math.min(mx,+x||0));upd()}})};
  const out=[h('button',{class:'btn ghost sm',type:'button',onclick:()=>{supSel=null;render()}},'رجوع إلى القائمة'),
    h('h2',{class:'axis-title',style:'margin-top:10px'},p.name),
    h('div',{class:'lock'},'تقيّمه بصفتك: '+role.who+'. تضع درجات المحاور '+roleAxes(role)+' فقط. باقي المحاور تملؤها جهة أخرى. الخانة الفارغة تُحسب صفراً.'),
    h('p',{class:'note'},[['inst','المؤسسة'],['title','اللقب العلمي'],['pos','المنصب'],['exact','الاختصاص الدقيق']].filter(x=>st.info[x[0]]).map(x=>x[1]+': '+st.info[x[0]]).join('. ')),
    h('div',{class:'qrow',style:'margin-bottom:10px'},h('button',{class:'btn ghost sm',type:'button',onclick:()=>{R.v={};render()}},'افرغ درجاتي'),
      (st.files.info||[]).length?h('span',null,'وثائق البيانات: ',st.files.info.map(f=>[fileLink(f),' '])):null)];
  AX.filter(mine).forEach(a=>{out.push(axHead(a),h('table',{class:'form'},
    h('thead',null,h('tr',null,h('th',null,'ت'),h('th',null,'الفقرات'),h('th',null,'ما قدّمه التدريسي من وثائق'),h('th',null,'الدرجة القصوى'),h('th',null,'درجتك'))),
    h('tbody',null,axItems(a,st).map((it,i)=>h('tr',null,h('td',{class:'c'},i+1),h('td',null,it.label),
      h('td',{style:'font-weight:400'},details(it,st).map(x=>h('div',null,x)),(st.files[it.id]||[]).length?h('ul',{class:'files'},st.files[it.id].map(f=>h('li',null,fileLink(f),h('span',{class:'meta'},kb(f.size))))):null),
      h('td',{class:'c','data-l':'الدرجة القصوى'},isFinite(capOf(it,st))?capOf(it,st):'—'),h('td',{class:'c','data-l':'درجتك'},rin(it)))))),
    (st.files[a.id]||[]).length?h('div',{class:'box'},'وثائق داعمة للمحور: ',st.files[a.id].map(f=>[fileLink(f),' '])):null)});
  const note=h('input',{class:'txt',style:'width:100%',type:'text',value:R.note,'aria-label':'ملاحظة للتدريسي',placeholder:'ملاحظة للتدريسي (اختياري)',oninput:e=>{R.note=e.target.value}});
  const sv=h('button',{class:'btn',type:'button'},'احفظ التقييم وأرسله إلى التدريسي');
  sv.onclick=busy(sv,'يُحفظ…',async()=>{msg.style.color='';msg.textContent='';
    const v={};for(const k in R.v){const it=ITEMS[k];if(it&&mine(it.ax))v[k]=R.v[k]}
    try{const rev={v,role:role.k,note:R.note.slice(0,500),at:Date.now(),by:myMail(),byName:(me.displayName||'').slice(0,120)};await db.doc('reviews/'+p.id).set(rev);p.rev=rev;
      msg.style.color='var(--ok)';msg.textContent='حُفظ التقييم ووصل إلى التدريسي، ودُمج مع تقييم الجهة الأخرى في درجته النهائية.'}
    catch(e){msg.textContent='تعذّر حفظ التقييم. أعد المحاولة.'}});
  out.push(h('div',{class:'box'},'أثر تقييمك في الدرجة النهائية (بعد الأوزان): ',fin,h('div',{style:'margin:8px 0'},note),h('div',{class:'qrow'},sv),msg));
  upd();return out;
}

function render(){
  const s=secs().find(x=>x.id===cur)||secs()[0];cur=s.id;
  const c=s.ax?renderAxis(s.ax):cur==='info'?renderInfo():cur==='smart'?renderSmart():cur==='docs'?renderDocs():cur==='tips'?renderTips():cur==='sup'?renderSup():renderRes();
  main.replaceChildren(...c.flat(4).filter(Boolean),footer());
  document.querySelector('.score').hidden=cur==='sup';
}

/* ---------- التشغيل ---------- */
(function(){const R=document.documentElement,B=document.getElementById('thBtn');
  const now=()=>R.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const show=()=>{const d=now()==='dark';B.classList.toggle('night',d);B.setAttribute('aria-label',d?'بدّل إلى الوضع النهاري':'بدّل إلى الوضع الليلي');B.title=d?'الوضع الليلي':'الوضع النهاري'};
  try{const t=localStorage.getItem('form10-theme');if(t==='light'||t==='dark')R.dataset.theme=t}catch(e){}
  B.onclick=()=>{const t=now()==='dark'?'light':'dark';R.dataset.theme=t;try{localStorage.setItem('form10-theme',t)}catch(e){}show()};show()})();
loadLocal();
try{if(window.indexedDB){assets=localAssets;IDB.open().catch(()=>{assets=null})}}catch(e){}
downloads=localDownloads;
nav();render();refresh();setSave('يُحفظ تلقائياً على هذا الجهاز');
fbInit();
